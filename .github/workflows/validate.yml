name: Validate Plugin PR

on:
  pull_request:
    paths:
      - "resources/plugins/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build registry engine
        run: npm run build

      - name: Validate YAML against schema
        id: validate
        run: |
          npm start 2>&1 | tee /tmp/registry-build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "status=failed" >> $GITHUB_OUTPUT
          else
            echo "status=passed" >> $GITHUB_OUTPUT
          fi

      - name: Post validation result as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('/tmp/registry-build.log', 'utf8');
            const status = '${{ steps.validate.outputs.status }}';
            const icon = status === 'passed' ? '✅' : '❌';
            const body = [
              `${icon} **Registry validation ${status}**`,
              '',
              'Schema validation ran against all plugin YAML files.',
              status === 'failed' ? '```\n' + log.slice(-3000) + '\n```' : '',
              '',
              '> A maintainer will review the plugin source code and merge when ready.',
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail if validation failed
        if: steps.validate.outputs.status == 'failed'
        run: exit 1
